# Shared dev PostgreSQL: `make dev` / `make up` / `make db-up|db-down|db-reset`
# and every worktree go through scripts/ensure-postgres.sh, which passes this
# file with -f. It is deliberately NOT named docker-compose.yml: the repo root
# must carry no default compose file, because a bare `docker compose` there
# would adopt this project — and it shares project name `multica` and volume
# `pgdata` with docker-compose.selfhost.yml, so it would recreate the self-host
# stack's postgres container from these 16 lines. Always pass -f.
name: multica

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: multica
      POSTGRES_USER: ${POSTGRES_USER:-multica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multica}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
