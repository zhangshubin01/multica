# 本机 override（内网入口 + 运维加固）：在现有自托管栈前面加一个 Caddy（服务名 edge），
# 让同一局域网里的其他机器能通过 http://<本机IP>/ 访问，并让 /ws 的
# WebSocket 升级走得通（Next.js rewrite 不转发 Upgrade 握手）。
#
# 后端/前端仍然只绑 127.0.0.1，所以本机的 multica daemon（server_url=localhost:3100）
# 完全不受影响；对外只多开一个 80 端口。
#
# 本文件是本机/内网部署的覆盖层（2026-11-19 起已进仓库），所以除了内网入口，还承载三类
# "上游模板没写、但换到团队服务器就会出问题"的加固，都只影响容器运行时、不改应用行为：
#   1. 日志轮转（x-logging）：上游三个 compose 都没有 logging 段。本机靠 OrbStack
#      守护进程的内置默认值（json-file, max-size=20m, max-file=5）侥幸有轮转，
#      但普通 Linux Docker 主机的 json-file 默认**不限制**，日志会一直涨到填满磁盘。
#      这里显式声明，数值与本机现状一致（20m × 5 = 100MB/容器），换机器不会突然变行为。
#   2. healthcheck：上游只有 postgres / redis 有探活，backend / frontend / edge 都没有，
#      于是进程卡死时 `docker ps` 仍显示 Up。backend 探 /readyz（含 DB + 迁移检查），
#      frontend 探 `/`，edge 探 admin API :2019（探 `/` 会被 frontend 的故障连坐）。
#      镜像里的 wget 都是 BusyBox 版，不支持 --spider，所以直接丢弃响应体。
#   3. backend 用服务名直连 redis（外加 depends_on）：见下方 redis / backend 两处注释。
#
# 用法（三个 -f 一起用，保持源码构建的 dev 镜像）：
#   docker compose -f docker-compose.selfhost.yml -f docker-compose.selfhost.build.yml -f docker-compose.lan.yml up -d
# 只停试跑的入口：
#   docker compose -f docker-compose.selfhost.yml -f docker-compose.selfhost.build.yml -f docker-compose.lan.yml stop edge
# 彻底回退：stop edge + 删掉 .env 里 CORS_ALLOWED_ORIGINS / MULTICA_APP_URL 的改动。
# 只回退本节加固：删掉下面的 x-logging / logging / healthcheck 三处即可（纯运行时配置，无副作用）。

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # 只为了给 base 里定义的服务加 logging —— override 只能改自己声明过的服务。
  # 这两块不含其它字段，不会覆盖 base 的镜像/卷/端口。
  postgres:
    logging: *default-logging

  frontend:
    logging: *default-logging
    healthcheck:
      # Next.js standalone 启动约 10–20s，start_period 留余量；探针实测 60ms 量级。
      # 只探 `/`（能回 200 即说明进程与路由都活着），不依赖后端——backend 有自己的 /readyz。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Redis：作为项目内服务，OrbStack 里才会归到 multica 组，并且跟随项目命令起停。
  # 仍发布到宿主回环 127.0.0.1:6379，但那是给**宿主侧**工具（CLI / 测试 / redis-cli）用的；
  # 容器里的 backend 走服务名 redis:6379（见下方 backend 的 REDIS_URL），不再经过宿主端口。
  # 原因：host.docker.internal 要绕 OrbStack 网关（容器 → 0.250.250.254 → 宿主回环 →
  # 发布端口 → 容器），多两跳、多两个失败面（宿主端口被占就静默失效）；而且三个 compose
  # 都没有 extra_hosts: host-gateway，Linux 主机上该名字默认不解析——搬机器时会直接断。
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile.lan:/etc/caddy/Caddyfile:ro
      - edge_data:/data
      - edge_config:/config
    logging: *default-logging
    healthcheck:
      # 探 Caddy 的 admin API（默认 localhost:2019，Caddyfile.lan 没有 `admin off`），
      # 实测 10ms。**不要**探 `/`：那条路会穿过 Caddy 打到 frontend，
      # frontend 一挂就会把 edge 判成 unhealthy，把别人的故障算到自己头上。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 有了反代之后，后端看到的对端是前端容器（实测 192.168.148.4），所以认证限流
  # 默认会把"整个团队"算成一个 IP 共用一个桶。这里把 Docker 网段登记为可信代理，
  # 让限流按 X-Forwarded-For 里的真实客户端 IP 计数。
  # 2026-11-18（P0-4）：Caddyfile.lan 已把 /auth/* 直连后端，但实测发现
  # OrbStack 的宿主端口发布会抹掉客户端源地址（探针容器无论收到 loopback 还是
  # LAN 网卡的请求，源都是 VM 网关 192.168.215.1/192.168.148.1），Caddy 设的
  # X-Forwarded-For 恒为网关、落在可信网段内 → 键仍是网关，"每人一份"不成立。
  # 因此阈值维持团队的 30 / 120（全团队一桶下的务实值）；迁移到 Linux 主机
  # （iptables 保留源地址）后把这两行改回 5 / 20 即自动按真实 IP 限流。
  backend:
    logging: *default-logging
    # redis 服务由本文件定义，把它声明成依赖：宿主重启后后端不会在 redis 就绪前抢跑
    # （base 里只有 postgres 的 depends_on）。映射形式在这里与 base 的那条合并。
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # 容器内用服务名直连（redis → 192.168.148.3，同网络）。environment 的优先级高于
      # .env 插值，所以 .env 里那行 host.docker.internal 只留给宿主侧工具，不再进容器。
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_TRUSTED_PROXIES: ${RATE_LIMIT_TRUSTED_PROXIES:-192.168.148.0/24}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-30}
      RATE_LIMIT_AUTH_VERIFY: ${RATE_LIMIT_AUTH_VERIFY:-120}
      # 日志级别：上游三个 compose 都不透传 LOG_LEVEL（server/internal/logger 未设置时默认
      # debug），生产里 daemon 心跳会把日志刷到约 300+ 行/分。取值由 .env 决定，留空＝沿用
      # 上游默认（debug）；排查企微/飞书逐帧问题时临时改成 debug 即可。
      LOG_LEVEL: ${LOG_LEVEL:-}
      # 邀请限流（三道闸：actor 每邀请人 / workspace 每工作区 / recipient 每收件邮箱）。
      # 上游 `docker-compose.selfhost.yml` 漏了这三个变量（.env.example 里有文档、模板里没有），
      # 所以默认哪怕写进 .env 也进不了容器 —— 这里补上透传，取值由 .env 决定，
      # 留空则回落到代码默认 10 / 50 / 6（20 人一次拉完会被 actor 那道挡住）。
      RATE_LIMIT_INVITATION_ACTOR_10M: ${RATE_LIMIT_INVITATION_ACTOR_10M:-}
      RATE_LIMIT_INVITATION_WORKSPACE_24H: ${RATE_LIMIT_INVITATION_WORKSPACE_24H:-}
      RATE_LIMIT_INVITATION_RECIPIENT_24H: ${RATE_LIMIT_INVITATION_RECIPIENT_24H:-}
      # 功能开关（pkg/featureflag：FF_<FLAG_KEY> 覆盖 YAML 规则文件）。compose 默认
      # 不透传任何 FF_*，所以要在模板里显式接一次。plugins_v1 打开后侧边栏才出现
      # Settings → Plugins（settings-page.tsx:206），后端插件 API 也才不再 503。
      FF_PLUGINS_V1: ${FF_PLUGINS_V1:-true}
      # docs_v1 打开后才有工作区知识库：左栏 Docs 入口、/api/docs 与
      # /api/doc-folders、以及写进 agent brief 的 `multica doc` 命令。
      # 默认开；要关用 `FF_DOCS_V1=false docker compose … up -d backend`。
      FF_DOCS_V1: ${FF_DOCS_V1:-true}
      # composio_mcp_apps 打开后才有 Settings → Composio 连接与 Agent → Apps 标签，
      # 以及 agent 的 Private / Public-to 访问选择器（MUL-3963，与 Composio 同开关）。
      # 后端还要 COMPOSIO_API_KEY（项目级密钥，只在 .env / 密钥目录，不进仓库）才能
      # 初始化 SDK；无 key 时 flag 开着也报 integration disabled。
      FF_COMPOSIO_MCP_APPS: ${FF_COMPOSIO_MCP_APPS:-true}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      # remote MCP apps（Connected Apps）的 secretbox 主密钥（32 字节 base64，
      # 用 openssl rand -base64 32 生成）。上游三个 compose 都不传这个键，缺它时
      # 启动日志是 "connected apps: remote MCP apps disabled"——即使
      # FF_COMPOSIO_MCP_APPS 与 COMPOSIO_API_KEY 都配好了（server/cmd/server/router.go:1431）。
      # 与 Composio 成对使用；只在 .env / 密钥目录，不进仓库。
      MULTICA_APPS_SECRET_KEY: ${MULTICA_APPS_SECRET_KEY:-}
      # Remote MCP / Connected Apps 的端点守卫要求解析结果是公网地址。本机容器出网走
      # Clash 的 fake-IP，任何域名都解析成 198.18.0.0/15（v6 为 2001:2::/48），守卫会把
      # 它们判成"非公网"，于是 App 的 OAuth 发现直接 502（failed to start connect）。
      # 把代理的合成网段声明进来即可；留空＝保持上游严格模式。
      MULTICA_REMOTE_MCP_ALLOW_CIDRS: ${MULTICA_REMOTE_MCP_ALLOW_CIDRS:-}
    healthcheck:
      # /readyz 会检查 DB 与迁移状态（不是只回 200 的浅探针）。
      # BusyBox wget 没有 --spider，所以丢弃响应体，只看退出码。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  edge_data:
  edge_config:
  redis_data:
